name: dev 

on:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
      - name: Mod
        run: go mod init padita
      - name: Build
        run: go build -o main .
      - name: Linter
        run: go vet ./...